<!DOCTYPE html>
<html lang="en-KE">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#312E81" />
  <title>DukaFlow — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(180deg, #EEF2FF 0%, #FFFFFF 100%);
      color: #1E293B;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 360px;
      width: 100%;
      background: #FFFFFF;
      border-radius: 16px;
      padding: 40px 28px;
      box-shadow: 0 4px 24px rgba(49, 46, 129, 0.08);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      color: #312E81;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #312E81;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }
    p {
      font-size: 15px;
      color: #64748B;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 24px;
      background: #312E81;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-family: inherit;
    }
    button:hover { background: #1E1B4B; }
    button:active { transform: scale(0.98); }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 32px;
      font-size: 14px;
      font-weight: 600;
      color: #94A3B8;
    }
    .logo span { color: #E8835C; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Offline Icon (WifiOff) -->
    <div class="icon">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" y1="2" x2="22" y2="22" />
        <path d="M8.5 16.5a5 5 0 0 1 7 0" />
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
        <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
      </svg>
    </div>

    <h1>You're Offline</h1>
    <p>
      Don't worry — you can still view your inventory and recent sales.
      Reconnect to sync new data.
    </p>

    <button id="retry-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10" />
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
      </svg>
      Try Again
    </button>

    <div class="logo">
      Duka<span>Flow</span>
    </div>
  </div>

  <script>
    document.getElementById('retry-btn').addEventListener('click', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
